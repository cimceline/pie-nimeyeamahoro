[build]
builder = "dockerfile"
dockerfilePath = "backend/Dockerfile"

[deploy]
startCommand = "node src/seeds/seed.js && node src/server.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[environment]
NODE_ENV = "production"
PORT = "5000"
JWT_EXPIRE = "15m"
JWT_REFRESH_EXPIRE = "7d"
UPLOAD_DIR = "./uploads"
MAX_FILE_SIZE = "10485760"
